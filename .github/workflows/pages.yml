name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the scene from the cached OSM extracts
        run: python3 build/build_scene.py

      - name: Rebuild the standalone page
        run: python3 build/bundle.py

      - name: Fail if the build left anything uncommitted
        run: |
          if ! git diff --quiet -- data/city.json wtc.html; then
            echo "::warning::data/city.json or wtc.html differ from the committed copies."
            git diff --stat -- data/city.json wtc.html
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html wtc.html _site/
          cp -r src vendor data assets _site/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
